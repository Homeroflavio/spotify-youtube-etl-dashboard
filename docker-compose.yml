services:

  postgres:
    image: postgres:16

    container_name: spotify_postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: spotify_youtube

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  dashboard:
    build: .

    container_name: spotify_dashboard

    ports:
      - "8050:8050"

    depends_on:
      - postgres

    environment:
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: spotify_youtube
      DB_SSLMODE: disable

volumes:
  postgres_data: